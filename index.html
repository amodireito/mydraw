<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pressure Canvas Drawing App</title>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body, html { margin:0; padding:0; height:100%; overflow:hidden; font-family:'Google Sans',sans-serif; background:#f0f0f0; }
    #toolbar { position:absolute; top:0; left:0; width:160px; height:100%; background:#d0cfc9; border-right:1px solid #ccc; padding:12px; display:flex; flex-direction:column; gap:12px; box-shadow:2px 0 8px rgba(0,0,0,0.1); }
    #canvasContainer { position:absolute; top:0; left:160px; right:0; bottom:0; }
    .section { display:flex; flex-direction:column; gap:6px; padding:10px; background:#fff; border-radius:6px; border:1px dashed #bbb; }
    label { font-size:0.76em; font-weight:500; color:#555; text-align:center; }
    .picker-group { display:flex; gap:10px; }
    .picker-group > div { flex:1; display:flex; flex-direction:column; gap:3px; }
    input[type=color] { -webkit-appearance:none; border:none; width:100%; height:26px; cursor:pointer; border-radius:4px; }
    input[type=color]::-webkit-color-swatch-wrapper{padding:0;border-radius:4px;}
    input[type=color]::-webkit-color-swatch{border:1px solid #888;border-radius:4px;}
    input[type=range] { width:100%; }
    select, button { width:100%; padding:6px; border-radius:4px; border:1px solid #aaa; background:#fff; cursor:pointer; transition:background 0.2s; font-size:0.76em; }
    select:focus, input[type=range]:focus { outline:none; border-color:#888; }
    button:hover { background:#e0e0e0; }
    #layers { max-height:144px; overflow-y:auto; display:flex; flex-direction:column; gap:4px; }
    .layer-item { display:flex; align-items:center; padding:5px; border-radius:4px; transition:background 0.2s; }
    .layer-item:hover { background:rgba(0,0,0,0.05); }
    .layer-item input[type=checkbox] { margin-right:6px; transform:scale(0.9); }
    .layer-item span { flex:1; cursor:pointer; text-transform:capitalize; font-size:0.76em; }
    .layer-item button { background:none; border:none; cursor:pointer; font-size:1em; color:#a00; }
    .swatch-container { display:flex; gap:5px; flex-wrap:wrap; }
    .swatch { width:19px; height:19px; border:1px solid #888; cursor:pointer; border-radius:4px; transition:transform 0.1s; }
    .swatch:hover { transform:scale(1.1); }
    .footer { margin-top:auto; font-size:0.64em; line-height:1.4em; text-align:left; color:#333; }
    #exportBtn { margin-top:6px; padding:6px; font-weight:500; font-size:0.76em; }
  </style>
</head>
<body>
  <div id="toolbar">
    <div class="picker-group section">
      <div><label>Pincel</label><input type="color" id="colorPicker" value="#3a93c0"></div>
      <div><label>BG</label><input type="color" id="bgColorPicker" value="#e8e6e1"></div>
    </div>
    <div class="section">
      <label>Histórico Pincel</label>
      <div id="strokeHistory" class="swatch-container"></div>
      <label>Histórico BG</label>
      <div id="bgHistory" class="swatch-container"></div>
    </div>
    <div class="section">
      <label>Pincel</label>
      <label>Estilo ponta</label>
      <select id="brushStyle">
        <option value="jitter">Jitter</option>
        <option value="normal">Normal</option>
        <option value="dotted">Pontilhado</option>
      </select>
      <label>Tamanho</label>
      <input type="range" id="brushSizeRange" min="1" max="100" value="4">
      <label>Opacidade</label>
      <input type="range" id="brushOpacityRange" min="0" max="1" step="0.01" value="0.2">
    </div>
    <div class="section">
      <label>Borracha</label>
      <label>Tamanho</label>
      <input type="range" id="eraserSizeRange" min="1" max="100" value="20">
      <label>Opacidade</label>
      <input type="range" id="eraserOpacityRange" min="0" max="1" step="0.01" value="0.6">
    </div>
    <div class="section">
      <label>Camadas</label>
      <div id="layers"></div>
      <button id="addLayer">+ nova camada</button>
    </div>
    <button id="exportBtn">💾 Exportar PNG</button>
    <div class="footer">
      <strong>Atalhos:</strong><br>
      B = pincel<br>
      E = borracha<br>
      + / - = tamanho
    </div>
  </div>
  <div id="canvasContainer"></div>
  <script>
    const container = document.getElementById('canvasContainer');
    const colorPicker = document.getElementById('colorPicker');
    const bgColorPicker = document.getElementById('bgColorPicker');
    const brushSizeRange = document.getElementById('brushSizeRange');
    const brushOpacityRange = document.getElementById('brushOpacityRange');
    const eraserSizeRange = document.getElementById('eraserSizeRange');
    const eraserOpacityRange = document.getElementById('eraserOpacityRange');
    const brushStyle = document.getElementById('brushStyle');
    const addLayerBtn = document.getElementById('addLayer');
    const exportBtn = document.getElementById('exportBtn');
    const layersDiv = document.getElementById('layers');
    const strokeHistoryDiv = document.getElementById('strokeHistory');
    const bgHistoryDiv = document.getElementById('bgHistory');

    let bgCanvas, bgCtx;
    let layers = [], activeLayer = null;
    let strokeHistory = [], bgHistory = [];
    let tool = 'brush';

    function darkenColor(hex, amt) {
      let usePound = false;
      if (hex[0] === '#') { hex = hex.slice(1); usePound = true; }
      let num = parseInt(hex, 16);
      let r = (num >> 16) & 0xFF, g = (num >> 8) & 0xFF, b = num & 0xFF;
      r = Math.max(0, Math.min(255, r * (1 - amt)));
      g = Math.max(0, Math.min(255, g * (1 - amt)));
      b = Math.max(0, Math.min(255, b * (1 - amt)));
      return (usePound ? '#' : '') + ((r << 16 | g << 8 | b).toString(16).padStart(6, '0'));
    }

    function initBackground() {
      bgCanvas = document.createElement('canvas');
      bgCanvas.width = container.clientWidth;
      bgCanvas.height = container.clientHeight;
      bgCanvas.style.position = 'absolute';
      bgCanvas.style.top = 0;
      bgCanvas.style.left = 0;
      bgCanvas.style.zIndex = 0;
      container.appendChild(bgCanvas);
      bgCtx = bgCanvas.getContext('2d');
      updateBackground(bgColorPicker.value);
    }

    function updateBackground(color) {
      bgCtx.fillStyle = color;
      bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
      document.getElementById('toolbar').style.background = darkenColor(color, 0.2);
      addToBgHistory(color);
    }

    function addToStrokeHistory(col) {
      if (!strokeHistory.includes(col)) strokeHistory.unshift(col);
      if (strokeHistory.length > 8) strokeHistory.pop();
      renderHistory();
    }
    function addToBgHistory(col) {
      if (!bgHistory.includes(col)) bgHistory.unshift(col);
      if (bgHistory.length > 8) bgHistory.pop();
      renderHistory();
    }
    function renderHistory() {
      strokeHistoryDiv.innerHTML = '';
      strokeHistory.forEach(c => { const s = document.createElement('div'); s.className='swatch'; s.style.background=c; s.onclick=()=>colorPicker.value=c; strokeHistoryDiv.appendChild(s); });
      bgHistoryDiv.innerHTML = '';
      bgHistory.forEach(c => { const s = document.createElement('div'); s.className='swatch'; s.style.background=c; s.onclick=()=>{bgColorPicker.value=c;updateBackground(c);} ; bgHistoryDiv.appendChild(s); });
    }

    function renderLayersPanel() {
      layersDiv.innerHTML='';
      layers.slice().reverse().forEach(layer=>{
        const item=document.createElement('div'); item.className='layer-item';
        const chk=document.createElement('input'); chk.type='checkbox'; chk.checked=layer.visible;
        chk.onchange=()=>{layer.visible=chk.checked;layer.canvas.style.display=chk.checked?'block':'none';};
        const name=document.createElement('span'); name.textContent=layer.name;
        name.onclick=()=>{activeLayer=layer;};
        const delBtn=document.createElement('button'); delBtn.textContent='✕';
        delBtn.onclick=()=>{ const i=layers.indexOf(layer); if(i>=0){ container.removeChild(layer.canvas); layers.splice(i,1); renderLayersPanel(); }};
        item.append(chk,name,delBtn);
        layersDiv.appendChild(item);
      });
    }

    function createLayer(name) {
      const canvas=document.createElement('canvas');
      canvas.width=container.clientWidth; canvas.height=container.clientHeight;
      canvas.style.position='absolute';canvas.style.top=0;canvas.style.left=0;
      canvas.style.zIndex=layers.length+1;
      container.appendChild(canvas);
      const ctx=canvas.getContext('2d'); ctx.lineCap='round'; ctx.lineJoin='round';
      const layer={canvas,ctx,name,history:[],historyIndex:-1,visible:true};
      layers.push(layer); activeLayer=layer; renderLayersPanel(); return layer;
    }

    function saveHistory() {
      if(!activeLayer) return;
      const data=activeLayer.ctx.getImageData(0,0,activeLayer.canvas.width,activeLayer.canvas.height);
      activeLayer.history.splice(activeLayer.historyIndex+1);
      activeLayer.history.push(data);
      activeLayer.historyIndex++;
      if(activeLayer.history.length>50) activeLayer.history.shift(),activeLayer.historyIndex--;
    }

    function undo() {
      if(!activeLayer) return;
      if(activeLayer.historyIndex>0){
        activeLayer.historyIndex--;
        activeLayer.ctx.putImageData(activeLayer.history[activeLayer.historyIndex],0,0);
      } else if(activeLayer.historyIndex===0){
        activeLayer.historyIndex--;
        activeLayer.ctx.clearRect(0,0,activeLayer.canvas.width,activeLayer.canvas.height);
      }
    }

    let drawing=false, lastPoint=null;
    function pointerDown(e){ if(!activeLayer) return; drawing=true; lastPoint={x:e.offsetX,y:e.offsetY,pressure:e.pressure||0.5}; saveHistory(); if(tool==='brush') addToStrokeHistory(colorPicker.value); }
    function pointerMove(e){ if(!drawing||!activeLayer) return; const p={x:e.offsetX,y:e.offsetY,pressure:e.pressure||0.5}; const ctx=activeLayer.ctx; ctx.globalCompositeOperation=(tool==='eraser')?'destination-out':'source-over'; if(tool==='brush') ctx.strokeStyle=colorPicker.value; ctx.globalAlpha=(tool==='brush')?parseFloat(brushOpacityRange.value):parseFloat(eraserOpacityRange.value); const size=((tool==='brush')?parseFloat(brushSizeRange.value):parseFloat(eraserSizeRange.value))*p.pressure; ctx.lineWidth=size; if(brushStyle.value==='dotted') ctx.setLineDash([size,size*1.5]); else ctx.setLineDash([]); let x1=lastPoint.x,y1=lastPoint.y,x2=p.x,y2=p.y; if(brushStyle.value==='jitter'){const j=size*0.3; x1+=(Math.random()-0.5)*j; y1+=(Math.random()-0.5)*j; x2+=(Math.random()-0.5)*j; y2+=(Math.random()-0.5)*j;} ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke(); lastPoint=p; }
    function pointerUp(){ drawing=false; lastPoint=null; }

    addLayerBtn.onclick=()=> createLayer(`cam ${layers.length+1}`);
    exportBtn.onclick=()=>{ const exp=document.createElement('canvas'); exp.width=bgCanvas.width; exp.height=bgCanvas.height; const ectx=exp.getContext('2d'); ectx.drawImage(bgCanvas,0,0); layers.forEach(l=>{ if(l.visible) ectx.drawImage(l.canvas,0,0); }); const link=document.createElement('a'); link.download='drawing.png'; link.href=exp.toDataURL('image/png'); link.click(); };

    window.addEventListener('keydown',e=>{ if(e.key.toLowerCase()==='b') tool='brush'; else if(e.key.toLowerCase()==='e') tool='eraser'; else if(e.altKey&&(e.key==='+'||e.key==='=')){ if(tool==='brush') brushSizeRange.value=Math.min(+brushSizeRange.max,+brushSizeRange.value+1); else eraserSizeRange.value=Math.min(+eraserSizeRange.max,+eraserSizeRange.value+1);} else if(e.altKey&&e.key==='-'){ if(tool==='brush') brushSizeRange.value=Math.max(+brushSizeRange.min,+brushSizeRange.value-1); else eraserSizeRange.value=Math.max(+eraserSizeRange.min,+eraserSizeRange.value-1);} else if((e.metaKey||e.ctrlKey)&&e.key==='z'){ e.preventDefault(); undo(); }});

    initBackground(); createLayer('cam 1');
    container.addEventListener('pointerdown',pointerDown);
    container.addEventListener('pointermove',pointerMove);
    container.addEventListener('pointerup',pointerUp);
    container.addEventListener('pointerleave',pointerUp);
    window.addEventListener('resize',()=>{ bgCanvas.width=container.clientWidth; bgCanvas.height=container.clientHeight; updateBackground(bgColorPicker.value); layers.forEach(l=>{ const img=l.ctx.getImageData(0,0,l.canvas.width,l.canvas.height); l.canvas.width=container.clientWidth; l.canvas.height=container.clientHeight; l.ctx.putImageData(img,0,0); }); });
    bgColorPicker.addEventListener('change',e=>updateBackground(e.target.value));
  </script>
</body>
</html>
