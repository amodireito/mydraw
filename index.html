<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pressure Canvas Drawing App</title>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: 'Google Sans', sans-serif;
      background: #e0e0e0;
    }
    #toolbar {
      position: absolute;
      top: 0;
      right: 0;
      width: 220px;
      height: 100%;
      background: #2d2d2d;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: -2px 0 8px rgba(0,0,0,0.3);
      color: #ccc;
      z-index: 10;
    }
    #canvasContainer {
      position: absolute;
      top: 0;
      left: 0;
      right: 220px;
      bottom: 0;
      overflow: hidden;
    }
    #canvasWrapper {
      position: absolute;
      top: 0;
      left: 0;
      transform: translate(0px,0px);
    }
    .section {
      background: #383838;
      padding: 12px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    label { font-size: 0.84em; font-weight: 500; color: #ccc; margin-bottom: 4px; }
    .picker-group { display: flex; flex-direction: column; gap: 8px; }
    input[type=color], input[type=range], select, button {
      width: 100%; background: #494949; border: 1px solid #555; border-radius: 6px; color: #eee;
    }
    input[type=color] { height: 28px; padding: 0; }
    input[type=range]::-webkit-slider-thumb { background: #777; }
    select { padding: 8px; }
    button { padding: 10px; font-size: 0.85em; cursor: pointer; }
    button:hover { background: #555; }
    #layers { display: flex; flex-direction: column; gap: 8px; max-height: 140px; overflow-y: auto; }
    .layer-item { display: flex; align-items: center; gap: 8px; }
    .layer-item span { flex: 1; font-size: 0.84em; color: #eee; cursor: pointer; }
    .swatch-container { display: flex; gap: 8px; flex-wrap: wrap; }
    .swatch { width: 20px; height: 20px; border: 1px solid #666; border-radius: 4px; cursor: pointer; transition: transform 0.1s; }
    .swatch:hover { transform: scale(1.1); }
    .footer { margin-top: auto; font-size: 0.72em; color: #999; }
  </style>
</head>
<body>
  <div id="canvasContainer"><div id="canvasWrapper"></div></div>
  <div id="toolbar">
    <div class="section picker-group">
      <label>Pincel</label>
      <input type="color" id="colorPicker" value="#3a93c0">
      <label>BG</label>
      <input type="color" id="bgColorPicker" value="#e8e6e1">
    </div>
    <div class="section">
      <label>Histórico Pincel</label><div id="strokeHistory" class="swatch-container"></div>
      <label>Histórico BG</label><div id="bgHistory" class="swatch-container"></div>
    </div>
    <div class="section">
      <label>Estilo</label>
      <select id="brushStyle"><option value="normal">Normal</option><option value="jitter">Jitter</option><option value="dotted">Pontilhado</option></select>
      <label>Tamanho</label><input type="range" id="brushSizeRange" min="1" max="100" value="4">
      <label>Opacidade</label><input type="range" id="brushOpacityRange" min="0" max="1" step="0.01" value="0.2">
    </div>
    <div class="section">
      <label>Borracha</label>
      <label>Tamanho</label><input type="range" id="eraserSizeRange" min="1" max="100" value="20">
      <label>Opacidade</label><input type="range" id="eraserOpacityRange" min="0" max="1" step="0.01" value="0.6">
    </div>
    <div class="section">
      <label>Camadas</label><div id="layers"></div>
      <button id="addLayer">+ nova camada</button>
    </div>
    <button id="exportBtn">💾 Exportar PNG</button>
    <div class="footer">
      Atalhos:<br><strong>B</strong>=pincel | <strong>E</strong>=borracha<br><strong>Cmd+B</strong>=espelhar | Espaço+arrastar=pan
    </div>
  </div>
  <script>
    // Elementos
    const container = document.getElementById('canvasContainer');
    const wrapper = document.getElementById('canvasWrapper');
    const colorPicker = document.getElementById('colorPicker');
    const bgColorPicker = document.getElementById('bgColorPicker');
    const strokeHistoryDiv = document.getElementById('strokeHistory');
    const bgHistoryDiv = document.getElementById('bgHistory');
    const brushStyle = document.getElementById('brushStyle');
    const brushSizeRange = document.getElementById('brushSizeRange');
    const brushOpacityRange = document.getElementById('brushOpacityRange');
    const eraserSizeRange = document.getElementById('eraserSizeRange');
    const eraserOpacityRange = document.getElementById('eraserOpacityRange');
    const addLayerBtn = document.getElementById('addLayer');
    const exportBtn = document.getElementById('exportBtn');
    const layersDiv = document.getElementById('layers');

    // Variáveis
    let bgCanvas, bgCtx;
    let layers = [];
    let activeLayer = null;
    let strokeHistory = [], bgHistory = [];
    let tool = 'brush';
    let drawing = false;
    let points = [];
    let panX = 0, panY = 0, isPanning = false, isSpace = false;
    let panStart = { x: 0, y: 0 }, startPan = { x: 0, y: 0 };

    function darkenColor(hex, amt) {
      if (hex.startsWith('#')) hex = hex.slice(1);
      let num = parseInt(hex, 16);
      let r = (num >> 16) & 255, g = (num >> 8) & 255, b = num & 255;
      r = Math.round(r * (1 - amt)); g = Math.round(g * (1 - amt)); b = Math.round(b * (1 - amt));
      return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
    }

    function renderHistory() {
      strokeHistoryDiv.innerHTML = '';
      bgHistoryDiv.innerHTML = '';
      strokeHistory.forEach(c => {
        const s = document.createElement('div'); s.className = 'swatch'; s.style.background = c;
        s.onclick = () => { colorPicker.value = c; strokeHistory.unshift(c); if (strokeHistory.length > 8) strokeHistory.pop(); renderHistory(); };
        strokeHistoryDiv.appendChild(s);
      });
      bgHistory.forEach(c => {
        const s = document.createElement('div'); s.className = 'swatch'; s.style.background = c;
        s.onclick = () => updateBackground(c);
        bgHistoryDiv.appendChild(s);
      });
    }

    function renderLayers() {
      layersDiv.innerHTML = '';
      layers.slice().reverse().forEach(layer => {
        const item = document.createElement('div'); item.className = 'layer-item';
        const chk = document.createElement('input'); chk.type = 'checkbox'; chk.checked = layer.visible;
        chk.onchange = () => { layer.visible = chk.checked; layer.canvas.style.display = chk.checked ? 'block' : 'none'; };
        item.append(chk);
        const name = document.createElement('span'); name.textContent = layer.name;
        name.onclick = () => activeLayer = layer;
        item.append(name);
        const op = document.createElement('input'); op.type = 'range'; op.min = 0; op.max = 1; op.step = 0.01; op.value = layer.opacity;
        op.oninput = () => { layer.opacity = parseFloat(op.value); layer.canvas.style.opacity = layer.opacity; };
        item.append(op);
        const del = document.createElement('button'); del.textContent = '✕';
        del.onclick = () => { const i = layers.indexOf(layer); if (i > -1) { wrapper.removeChild(layer.canvas); layers.splice(i, 1); renderLayers(); activeLayer = layers[layers.length - 1] || null; }};
        item.append(del);
        layersDiv.appendChild(item);
      });
    }

    function saveHistory() {
      if (!activeLayer) return;
      const img = activeLayer.ctx.getImageData(0, 0, activeLayer.canvas.width, activeLayer.canvas.height);
      activeLayer.history.splice(activeLayer.historyIndex + 1);
      activeLayer.history.push(img);
      activeLayer.historyIndex++;
      if (activeLayer.history.length > 50) { activeLayer.history.shift(); activeLayer.historyIndex--; }
    }

    function undo() {
      if (!activeLayer) return;
      if (activeLayer.historyIndex > 0) {
        activeLayer.historyIndex--;
        activeLayer.ctx.putImageData(activeLayer.history[activeLayer.historyIndex], 0, 0);
      } else if (activeLayer.historyIndex === 0) {
        activeLayer.historyIndex--;
        activeLayer.ctx.clearRect(0, 0, activeLayer.canvas.width, activeLayer.canvas.height);
      }
    }

    function initBackground() {
      const w = container.clientWidth * 3;
      const h = container.clientHeight * 3;
      wrapper.style.width = w + 'px'; wrapper.style.height = h + 'px';
      bgCanvas = document.createElement('canvas'); bgCanvas.width = w; bgCanvas.height = h;
      Object.assign(bgCanvas.style, { position: 'absolute', top: `-${container.clientHeight}px`, left: `-${container.clientWidth}px`, zIndex: 0 });
      wrapper.appendChild(bgCanvas);
      bgCtx = bgCanvas.getContext('2d');
      updateBackground(bgColorPicker.value);
    }

    function updateBackground(color) {
      bgCtx.fillStyle = color; bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
      if (!bgHistory.includes(color)) bgHistory.unshift(color);
      if (bgHistory.length > 8) bgHistory.pop(); renderHistory();
      document.getElementById('toolbar').style.background = darkenColor(color, 0.2);
    }

    function createLayer(name) {
      const w = container.clientWidth * 3;
      const h = container.clientHeight * 3;
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      Object.assign(c.style, { position: 'absolute', top: `-${container.clientHeight}px`, left: `-${container.clientWidth}px`, zIndex: layers.length + 1, opacity: 1 });
      wrapper.appendChild(c);
      const ctx = c.getContext('2d'); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      const layer = { canvas: c, ctx, name, history: [], historyIndex: -1, visible: true, opacity: 1 };
      layers.push(layer);
      activeLayer = layer;
      renderLayers();
    }

    function mirrorHorizontal() {
      layers.forEach(layer => {
        if (!layer.visible) return;
        const { ctx, canvas } = layer;
        const temp = document.createElement('canvas'); temp.width = canvas.width; temp.height = canvas.height;
        temp.getContext('2d').drawImage(canvas, 0, 0);
        const prevAlpha = ctx.globalAlpha;
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save(); ctx.scale(-1, 1);
        ctx.drawImage(temp, -canvas.width, 0);
        ctx.restore();
        ctx.globalAlpha = prevAlpha;
      });
    }

    function getPointerPos(e) {
      const rect = container.getBoundingClientRect();
      return { x: e.clientX - rect.left - panX + container.clientWidth, y: e.clientY - rect.top - panY + container.clientHeight, pressure: e.pressure || 0.5 };
    }

    function pointerDown(e) {
      if (isSpace) {
        isPanning = true;
        panStart.x = e.clientX; panStart.y = e.clientY;
        startPan.x = panX; startPan.y = panY;
        return;
      }
      if (!activeLayer) return;
      drawing = true;
      points = [];
      const p = getPointerPos(e);
      points.push(p);
      saveHistory();
    }

    function pointerMove(e) {
      if (isPanning) {
        panX = startPan.x + (e.clientX - panStart.x);
        panY = startPan.y + (e.clientY - panStart.y);
        wrapper.style.transform = `translate(${panX}px,${panY}px)`;
        return;
      }
      if (!drawing || !activeLayer) return;
      const p = getPointerPos(e);
      points.push(p);
      const ctx = activeLayer.ctx;
      ctx.globalCompositeOperation = (tool === 'eraser') ? 'destination-out' : 'source-over';
      ctx.strokeStyle = (tool === 'brush') ? colorPicker.value : '#000';
      ctx.globalAlpha = (tool === 'brush') ? parseFloat(brushOpacityRange.value) : parseFloat(eraserOpacityRange.value);
      ctx.lineWidth = ((tool === 'brush') ? parseFloat(brushSizeRange.value) : parseFloat(eraserSizeRange.value)) * p.pressure;
      ctx.setLineDash([]);

      if (points.length >= 3) {
        const p0 = points[points.length - 3];
        const p1 = points[points.length - 2];
        const p2 = points[points.length - 1];
        const cx = (p0.x + p1.x) / 2;
        const cy = (p0.y + p1.y) / 2;
        const nx = (p1.x + p2.x) / 2;
        const ny = (p1.y + p2.y) / 2;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.quadraticCurveTo(p1.x, p1.y, nx, ny);
        ctx.stroke();
      }
    }

    function pointerUp() {
      drawing = false;
      points = [];
    }

    initBackground(); strokeHistory.unshift(colorPicker.value); renderHistory(); createLayer('cam 1');
    container.addEventListener('pointerdown', pointerDown);
    container.addEventListener('pointermove', pointerMove);
    container.addEventListener('pointerup', pointerUp);
    container.addEventListener('pointerleave', pointerUp);
    window.addEventListener('keydown', e => {
      if (e.code === 'Space') { e.preventDefault(); isSpace = true; }
      if (e.metaKey && e.key.toLowerCase() === 'b') mirrorHorizontal();
      if (/^[0-9]$/.test(e.key)) { brushOpacityRange.value = (e.key === '0') ? 1 : parseInt(e.key) / 10; }
      if (e.key === 'b') tool = 'brush'; else if (e.key === 'e') tool = 'eraser';
      if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); }
    });
    window.addEventListener('keyup', e => { if (e.code === 'Space') { isSpace = false; isPanning = false; } });
    window.addEventListener('resize', () => {
      const w = container.clientWidth * 3;
      const h = container.clientHeight * 3;
      bgCanvas.width = w; bgCanvas.height = h;
      updateBackground(bgColorPicker.value);
      layers.forEach(l => {
        const img = l.ctx.getImageData(0, 0, l.canvas.width, l.canvas.height);
        l.canvas.width = w; l.canvas.height = h;
        l.ctx.putImageData(img, 0, 0);
      });
      wrapper.style.transform = `translate(${panX}px,${panY}px)`;
    });
  </script>
</body>
</html>
